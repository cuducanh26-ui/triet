  { id: 'q1', ch: 1, topic: 'c1-1', level: 'Nhận biết', q: 'Triết học ra đời vào khoảng thời gian nào và ở đâu?', opts: ['Khoảng thế kỷ VIII – VI TCN ở cả phương Đông và phương Tây', 'Ngay khi loài người xuất hiện trong xã hội nguyên thủy', 'Thế kỷ XV – XVI tại châu Âu thời Phục hưng', 'Thế kỷ XIX tại nước Đức'], ans: 0, exp: 'Triết học ra đời gần như cùng lúc vào khoảng thế kỷ VIII – VI TCN tại các trung tâm văn minh lớn của phương Đông (Ấn Độ, Trung Quốc) và phương Tây (Hy Lạp cổ đại).' },
  { id: 'q2', ch: 1, topic: 'c1-1', level: 'Câu bẫy', q: 'Nguồn gốc xã hội dẫn đến sự ra đời của triết học là gì?', opts: ['Sự phát triển của khoa học tự nhiên hiện đại', 'Xã hội xuất hiện chế độ tư hữu, phân chia giai cấp và sự tách biệt lao động trí óc khỏi lao động chân tay', 'Nhu cầu sinh tồn cơ bản của bầy người nguyên thủy', 'Sự ra đời của máy móc đại công nghiệp'], ans: 1, exp: 'Nguồn gốc xã hội của triết học gắn với chế độ chiếm hữu nô lệ, khi lao động trí óc tách khỏi lao động chân tay và xuất hiện tầng lớp trí thức có điều kiện khái quát hóa lý luận.' },
  { id: 'q3', ch: 1, topic: 'c1-1', level: 'Nhận biết', q: 'Theo Ph. Ăngghen, vấn đề cơ bản lớn của mọi triết học, đặc biệt là triết học hiện đại, là mối quan hệ giữa:', opts: ['Lực lượng sản xuất và quan hệ sản xuất', 'Tư duy và tồn tại (ý thức và vật chất)', 'Cá nhân và xã hội', 'Cơ sở hạ tầng và kiến trúc thượng tầng'], ans: 1, exp: 'Ph. Ăngghen khẳng định trong tác phẩm Lútvích Phoiơbắc và sự cáo chung của triết học cổ điển Đức: vấn đề cơ bản của mọi triết học là mối quan hệ giữa tư duy và tồn tại.' },
  { id: 'q4', ch: 1, topic: 'c1-1', level: 'Câu bẫy', q: 'Việc giải quyết mặt thứ nhất của vấn đề cơ bản triết học là cơ sở để phân chia các nhà triết học thành:', opts: ['Thuyết khả tri và thuyết bất khả tri', 'Phương pháp biện chứng và phương pháp siêu hình', 'Chủ nghĩa duy vật và chủ nghĩa duy tâm', 'Chủ nghĩa duy vật lịch sử và chủ nghĩa duy tâm lịch sử'], ans: 2, exp: 'Mặt thứ nhất (bản thể luận) hỏi vật chất hay ý thức có trước/quyết định → chia thành CNDV và CNDT. Mặt thứ hai (nhận thức luận) mới chia thành khả tri và bất khả tri.' },
  { id: 'q5', ch: 1, topic: 'c1-1', level: 'Thông hiểu', q: 'Luận điểm của Hêghen cho rằng "Ý niệm tuyệt đối" có trước và sinh ra giới tự nhiên, xã hội thuộc trường phái nào?', opts: ['Chủ nghĩa duy tâm chủ quan', 'Chủ nghĩa duy tâm khách quan', 'Chủ nghĩa duy vật siêu hình', 'Nhị nguyên luận'], ans: 1, exp: 'CNDT khách quan thừa nhận một thực thể tinh thần khách quan tồn tại độc lập bên ngoài ý thức con người (như Ý niệm của Plato, Ý niệm tuyệt đối của Hegel) sinh ra thế giới.' },
  { id: 'q6', ch: 1, topic: 'c1-1', level: 'Thông hiểu', q: 'Hình thức phát triển cao nhất của chủ nghĩa duy vật trong lịch sử triết học là:', opts: ['Chủ nghĩa duy vật chất phác cổ đại', 'Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII', 'Chủ nghĩa duy vật biện chứng', 'Chủ nghĩa duy vật nhân bản của Feuerbach'], ans: 2, exp: 'Chủ nghĩa duy vật biện chứng do C. Mác và Ph. Ăngghen sáng lập, V.I. Lênin phát triển là đỉnh cao nhất, khắc phục hạn chế trực quan cổ đại và máy móc siêu hình.' },
  { id: 'q7', ch: 1, topic: 'c1-1', level: 'Câu bẫy', q: 'Quan điểm: "Vật chất và tinh thần là hai bản nguyên độc lập, tồn tại song song, không cái nào sinh ra cái nào" thuộc lập trường:', opts: ['Chủ nghĩa duy vật biện chứng', 'Chủ nghĩa duy tâm khách quan', 'Nhị nguyên luận', 'Thuyết bất khả tri'], ans: 2, exp: 'Nhị nguyên luận (tiêu biểu là R. Descartes) thừa nhận song song hai bản nguyên vật chất và tinh thần độc lập nhau.' },
  { id: 'q8', ch: 1, topic: 'c1-1', level: 'Thông hiểu', q: 'Đặc trưng cốt lõi của phương pháp tư duy siêu hình là:', opts: ['Xem xét sự vật trong mối liên hệ phổ biến và luôn vận động', 'Xem xét sự vật trong trạng thái cô lập, tách rời và tĩnh tại, bất biến', 'Coi đấu tranh giữa các mặt đối lập là nguồn gốc phát triển', 'Phản ánh đúng quy luật chuyển hóa từ lượng sang chất'], ans: 1, exp: 'Phương pháp siêu hình nhìn nhận sự vật cô lập, cứng nhắc, không phát triển (hoặc chỉ tăng giảm đơn thuần về lượng do tác động bên ngoài).' },
  { id: 'q9', ch: 1, topic: 'c1-2', level: 'Nhận biết', q: 'Tiền đề lý luận trực tiếp nhất cho sự ra đời của Triết học Mác là:', opts: ['Triết học cổ điển Đức (Hegel và Feuerbach)', 'Kinh tế chính trị cổ điển Anh', 'Chủ nghĩa xã hội không tưởng Pháp', 'Triết học Hy Lạp cổ đại'], ans: 0, exp: 'Triết học Mác kế thừa trực tiếp và có phê phán phép biện chứng của Hegel và chủ nghĩa duy vật của Feuerbach trong Triết học cổ điển Đức.' },
  { id: 'q10', ch: 1, topic: 'c1-2', level: 'Nhận biết', q: 'Ba phát minh lớn của khoa học tự nhiên thế kỷ XIX làm tiền đề cho sự ra đời Triết học Mác gồm:', opts: ['Thuyết tương đối, Cơ học lượng tử, Tia X', 'Định luật bảo toàn và chuyển hóa năng lượng, Học thuyết tế bào, Học thuyết tiến hóa của Darwin', 'Định luật vạn vật hấp dẫn, Thuyết nhật tâm, Định luật bảo toàn khối lượng', 'Phóng xạ, Điện tử, Cấu trúc ADN'], ans: 1, exp: '3 phát minh thế kỷ XIX (Bảo toàn năng lượng, Tế bào, Tiến hóa Darwin) đã giáng đòn mạnh vào tư duy siêu hình và thần học, tạo tiền đề KHTN trực tiếp cho CNDV biện chứng.' },
  { id: 'q11', ch: 1, topic: 'c1-2', level: 'Vận dụng', q: 'Nội dung chủ yếu, vĩ đại nhất tạo nên bước ngoặt cách mạng trong triết học do C. Mác và Ph. Ăngghen thực hiện là:', opts: ['Phát hiện ra nguyên tử và điện tử', 'Sáng tạo ra Chủ nghĩa duy vật lịch sử', 'Kế thừa nguyên xi phép biện chứng của Hegel', 'Xóa bỏ hoàn toàn các khoa học cụ thể'], ans: 1, exp: 'Sáng tạo ra CNDV lịch sử đã khắc phục tính "duy vật nửa vời" của các nhà duy vật trước Mác, đưa CNDV trở thành triệt để cả trong tự nhiên lẫn xã hội.' },
  { id: 'q12', ch: 1, topic: 'c1-2', level: 'Nhận biết', q: 'Tác phẩm nào đánh dấu sự ra đời chín muồi của Chủ nghĩa Mác với tư cách một học thuyết cách mạng hoàn chỉnh vào tháng 2/1848?', opts: ['Hệ tư tưởng Đức', 'Tuyên ngôn của Đảng Cộng sản', 'Biện chứng của tự nhiên', 'Bút ký triết học'], ans: 1, exp: 'Tuyên ngôn của Đảng Cộng sản (2/1848) do C. Mác và Ph. Ăngghen soạn thảo là văn kiện cương lĩnh đầu tiên đánh dấu sự ra đời chín muồi của chủ nghĩa Mác.' },

  // Chương 2 (18 câu)
  { id: 'q13', ch: 2, topic: 'c2-1', level: 'Nhận biết', q: 'Theo định nghĩa vật chất của V.I. Lênin, thuộc tính chung nhất, duy nhất để phân biệt vật chất với ý thức là:', opts: ['Có khối lượng và quảng tính', 'Tồn tại ở thể rắn, lỏng hoặc khí', 'Tồn tại khách quan, không lệ thuộc vào cảm giác (thực tại khách quan)', 'Có thể nhìn thấy bằng mắt thường'], ans: 2, exp: 'Thuộc tính duy nhất của vật chất mà chủ nghĩa duy vật triết học gắn liền với việc thừa nhận là thuộc tính tồn tại khách quan, tồn tại ngoài ý thức của chúng ta.' },
  { id: 'q14', ch: 2, topic: 'c2-1', level: 'Thông hiểu', q: 'Cuộc khủng hoảng trong vật lý học cuối thế kỷ XIX – đầu thế kỷ XX (phát hiện tia X, phóng xạ, điện tử) đã chứng minh điều gì?', opts: ['Vật chất đã tiêu tan biến mất hoàn toàn', 'Giới hạn hiểu biết cũ của con người về vật chất bị phá vỡ, không phải vật chất tiêu tan', 'Chủ nghĩa duy tâm là đúng đắn', 'Nguyên tử không còn tồn tại trong tự nhiên'], ans: 1, exp: 'Lênin chỉ rõ: không phải vật chất tiêu tan, mà chỉ có giới hạn nhận thức cũ (đồng nhất vật chất với nguyên tử bất biến) tiêu tan.' },
  { id: 'q15', ch: 2, topic: 'c2-1', level: 'Câu bẫy', q: 'Theo quan điểm CNDV biện chứng, mối quan hệ giữa vận động và đứng im là:', opts: ['Vận động là tương đối, đứng im là tuyệt đối', 'Cả vận động và đứng im đều là tuyệt đối', 'Vận động là tuyệt đối, vĩnh viễn; đứng im là tương đối, tạm thời', 'Đứng im là sự ngừng vận động hoàn toàn của vật chất'], ans: 2, exp: 'Vận động là phương thức tồn tại của vật chất nên tuyệt đối, vĩnh viễn; đứng im chỉ là tương đối, tạm thời trong một quan hệ và hình thức vận động xác định.' },
  { id: 'q16', ch: 2, topic: 'c2-1', level: 'Nhận biết', q: 'Trình tự 5 hình thức vận động cơ bản của vật chất từ thấp đến cao theo Ph. Ăngghen là:', opts: ['Cơ học → Hóa học → Vật lý → Sinh học → Xã hội', 'Cơ học → Vật lý → Hóa học → Sinh học → Xã hội', 'Vật lý → Cơ học → Hóa học → Xã hội → Sinh học', 'Hóa học → Vật lý → Cơ học → Sinh học → Xã hội'], ans: 1, exp: 'Thứ tự chuẩn của Ph. Ăngghen từ thấp đến cao: Cơ học → Vật lý → Hóa học → Sinh học → Xã hội.' },
  { id: 'q17', ch: 2, topic: 'c2-1', level: 'Câu bẫy', q: 'Yếu tố nào giữ vai trò quyết định TRỰC TIẾP cho sự ra đời của ý thức?', opts: ['Bộ óc người và thế giới khách quan', 'Lao động và ngôn ngữ (nguồn gốc xã hội)', 'Sự tiến hóa tự nhiên của loài vượn cổ', 'Cảm giác và bản năng sinh tồn'], ans: 1, exp: 'Bộ óc người và thế giới khách quan là nguồn gốc tự nhiên (điều kiện cần); lao động và ngôn ngữ (nguồn gốc xã hội) mới là điều kiện đủ, quyết định trực tiếp.' },
  { id: 'q18', ch: 2, topic: 'c2-1', level: 'Câu bẫy', q: 'Trong kết cấu theo chiều ngang của ý thức (tri thức, tình cảm, niềm tin, ý chí), yếu tố nào là hạt nhân cốt lõi quan trọng nhất?', opts: ['Tình cảm', 'Ý chí', 'Niềm tin', 'Tri thức'], ans: 3, exp: 'Tri thức là phương thức tồn tại của ý thức và là điều kiện để ý thức phát triển; không có tri thức thì tình cảm, niềm tin trở nên mù quáng.' },
  { id: 'q19', ch: 2, topic: 'c2-1', level: 'Vận dụng', q: 'Ý thức có thể tác động trở lại làm biến đổi hiện thực vật chất bằng cách nào?', opts: ['Tự bản thân ý thức trực tiếp sinh ra của cải vật chất', 'Thông qua hoạt động thực tiễn của con người', 'Thông qua sự cầu nguyện và niềm tin thuần túy', 'Ý thức hoàn toàn thụ động, không thể tác động lại vật chất'], ans: 1, exp: 'Tự bản thân ý thức không trực tiếp làm thay đổi gì trong hiện thực; nó chỉ tác động trở lại vật chất thông qua hoạt động thực tiễn của con người.' },
  { id: 'q20', ch: 2, topic: 'c2-1', level: 'Vận dụng', q: 'Một doanh nghiệp đặt chỉ tiêu tăng trưởng doanh thu 500% trong 1 tháng mà bỏ qua năng lực sản xuất và sức mua thị trường đang mắc phải sai lầm nào?', opts: ['Bệnh thụ động, ỷ lại, bảo thủ', 'Bệnh chủ quan duy ý chí', 'Chủ nghĩa kinh nghiệm', 'Thuyết bất khả tri'], ans: 1, exp: 'Bất chấp điều kiện khách quan và quy luật kinh tế, chỉ xuất phát từ mong muốn chủ quan là biểu hiện điển hình của bệnh chủ quan duy ý chí.' },
  { id: 'q21', ch: 2, topic: 'c2-2', level: 'Thông hiểu', q: 'Quan điểm toàn diện trong nhận thức và thực tiễn được rút ra trực tiếp từ cơ sở lý luận nào?', opts: ['Nguyên lý về sự phát triển', 'Nguyên lý về mối liên hệ phổ biến', 'Quy luật phủ định của phủ định', 'Cặp phạm trù khả năng và hiện thực'], ans: 1, exp: 'Từ nguyên lý về mối liên hệ phổ biến rút ra quan điểm toàn diện (và quan điểm lịch sử - cụ thể).' },
  { id: 'q22', ch: 2, topic: 'c2-2', level: 'Câu bẫy', q: 'So sánh giữa "cái riêng" và "cái chung", khẳng định nào sau đây là ĐÚNG theo phép biện chứng duy vật?', opts: ['Cái chung rộng hơn và phong phú hơn cái riêng', 'Cái riêng phong phú hơn cái chung, còn cái chung sâu sắc hơn cái riêng', 'Cái chung tồn tại độc lập bên ngoài cái riêng', 'Cái đơn nhất không bao giờ có thể chuyển hóa thành cái chung'], ans: 1, exp: 'Vì Cái riêng = Cái chung + Cái đơn nhất nên cái riêng phong phú hơn; còn cái chung phản ánh thuộc tính lặp lại, ổn định, gắn với bản chất nên sâu sắc hơn.' },
  { id: 'q23', ch: 2, topic: 'c2-2', level: 'Thông hiểu', q: 'Trong quy luật Lượng – Chất, khoảng giới hạn mà ở đó sự thay đổi về lượng chưa làm thay đổi căn bản về chất của sự vật được gọi là:', opts: ['Điểm nút', 'Bước nhảy', 'Độ', 'Thuộc tính'], ans: 2, exp: 'Độ là khoảng giới hạn mà trong đó sự thay đổi về lượng chưa dẫn tới sự thay đổi căn bản về chất; Điểm nút là giới hạn mà lượng đổi đủ để tạo bước nhảy.' },
  { id: 'q24', ch: 2, topic: 'c2-2', level: 'Vận dụng', q: 'Tư tưởng nóng vội, muốn đốt cháy giai đoạn khi chưa tích lũy đủ về lượng là biểu hiện của khuynh hướng sai lầm nào?', opts: ['Bệnh hữu khuynh (bảo thủ, trì trệ)', 'Bệnh tả khuynh (nóng vội, chủ quan)', 'Chủ nghĩa chiết trung', 'Chủ nghĩa kinh nghiệm'], ans: 1, exp: 'Không chịu tích lũy lượng mà đòi thực hiện bước nhảy ngay là bệnh tả khuynh; ngược lại đã đủ lượng nhưng sợ không dám thực hiện bước nhảy là bệnh hữu khuynh.' },
  { id: 'q25', ch: 2, topic: 'c2-2', level: 'Nhận biết', q: 'Quy luật nào được V.I. Lênin gọi là "hạt nhân" của phép biện chứng duy vật?', opts: ['Quy luật chuyển hóa từ những thay đổi về lượng thành những thay đổi về chất và ngược lại', 'Quy luật thống nhất và đấu tranh của các mặt đối lập (Quy luật mâu thuẫn)', 'Quy luật phủ định của phủ định', 'Quy luật QHSX phù hợp với trình độ phát triển của LLSX'], ans: 1, exp: 'Quy luật mâu thuẫn là hạt nhân của phép biện chứng vì nó chỉ ra nguồn gốc, động lực bên trong của mọi sự vận động và phát triển.' },
  { id: 'q26', ch: 2, topic: 'c2-2', level: 'Câu bẫy', q: 'Trong quy luật mâu thuẫn, mối quan hệ giữa sự "thống nhất" và sự "đấu tranh" của các mặt đối lập là:', opts: ['Thống nhất là tuyệt đối, đấu tranh là tương đối', 'Đấu tranh là tuyệt đối, thống nhất là tương đối, tạm thời', 'Cả hai đều chỉ mang tính tương đối', 'Thống nhất là nguồn gốc duy nhất của sự phát triển'], ans: 1, exp: 'Sự thống nhất gắn với đứng im tương đối; sự đấu tranh gắn với vận động tuyệt đối nên đấu tranh là tuyệt đối.' },
  { id: 'q27', ch: 2, topic: 'c2-2', level: 'Thông hiểu', q: 'Hai đặc trưng cơ bản nhất của phủ định biện chứng là gì?', opts: ['Tính chủ quan và tính xóa bỏ hoàn toàn', 'Tính khách quan và tính kế thừa', 'Tính ngẫu nhiên và tính lặp lại nguyên xi', 'Tính áp đặt từ bên ngoài và tính tuần hoàn'], ans: 1, exp: 'Phủ định biện chứng mang tính khách quan (tự thân phủ định) và tính kế thừa (giữ lại yếu tố tích cực, lọc bỏ tiêu cực).' },
  { id: 'q28', ch: 2, topic: 'c2-3', level: 'Câu bẫy', q: 'Trong 3 hình thức cơ bản của hoạt động thực tiễn, hình thức nào là cơ bản nhất, đầu tiên và quyết định các hình thức khác?', opts: ['Hoạt động thực nghiệm khoa học', 'Hoạt động chính trị - xã hội', 'Hoạt động sản xuất vật chất', 'Hoạt động nghiên cứu lý thuyết'], ans: 2, exp: 'Hoạt động sản xuất vật chất là hình thức cơ bản nhất, nguyên thủy nhất, tạo cơ sở vật chất cho mọi hoạt động khác.' },
  { id: 'q29', ch: 2, topic: 'c2-3', level: 'Câu bẫy', q: 'Hình thức "Biểu tượng" thuộc giai đoạn nào của quá trình nhận thức?', opts: ['Giai đoạn nhận thức lý tính (tư duy trừu tượng)', 'Giai đoạn nhận thức cảm tính (trực quan sinh động)', 'Giai đoạn hoạt động thực tiễn', 'Không thuộc giai đoạn nào của nhận thức'], ans: 1, exp: 'Nhận thức cảm tính gồm 3 hình thức: Cảm giác → Tri giác → Biểu tượng. Biểu tượng là hình thức cao nhất của cảm tính (bước đệm sang lý tính).' },
  { id: 'q30', ch: 2, topic: 'c2-3', level: 'Thông hiểu', q: 'Luận điểm "Không có chân lý trừu tượng, chân lý luôn luôn là cụ thể" phản ánh tính chất nào của chân lý?', opts: ['Tính khách quan', 'Tính tuyệt đối', 'Tính cụ thể', 'Tính chủ quan'], ans: 2, exp: 'Mọi chân lý đều phản ánh sự vật trong những điều kiện không gian, thời gian và mối liên hệ xác định; vượt ra khỏi điều kiện đó chân lý có thể trở thành sai lầm.' },

  // Chương 3 (15 câu)
  { id: 'q31', ch: 3, topic: 'c3-1', level: 'Câu bẫy', q: 'Trong lực lượng sản xuất, yếu tố nào giữ vai trò QUYẾT ĐỊNH hàng đầu và yếu tố nào là yếu tố ĐỘNG NHẤT, CÁCH MẠNG NHẤT?', opts: ['Công cụ lao động quyết định hàng đầu; Người lao động động nhất', 'Người lao động quyết định hàng đầu; Công cụ lao động động nhất, cách mạng nhất', 'Đối tượng lao động quyết định hàng đầu; Tư liệu lao động động nhất', 'Khoa học công nghệ quyết định hàng đầu; Đối tượng lao động động nhất'], ans: 1, exp: 'Người lao động là chủ thể sáng tạo và sử dụng công cụ nên giữ vai trò quyết định hàng đầu; công cụ lao động luôn được cải tiến liên tục nên là yếu tố động nhất, cách mạng nhất.' },
  { id: 'q32', ch: 3, topic: 'c3-1', level: 'Nhận biết', q: 'Trong 3 mặt của quan hệ sản xuất, quan hệ nào giữ vai trò quyết định, chi phối các quan hệ khác?', opts: ['Quan hệ phân phối sản phẩm lao động', 'Quan hệ tổ chức và quản lý sản xuất', 'Quan hệ sở hữu đối với tư liệu sản xuất', 'Quan hệ trao đổi hàng hóa'], ans: 2, exp: 'Ai nắm quyền sở hữu tư liệu sản xuất thì người đó có quyền tổ chức quản lý và quyết định cách phân phối sản phẩm.' },
  { id: 'q33', ch: 3, topic: 'c3-1', level: 'Câu bẫy', q: 'Trong Triết học Mác - Lênin, khái niệm "Cơ sở hạ tầng" dùng để chỉ:', opts: ['Hệ thống đường giao thông, cầu cống, điện, nước, viễn thông', 'Toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một xã hội nhất định', 'Toàn bộ lực lượng sản xuất và tài nguyên thiên nhiên', 'Hệ thống nhà máy, xí nghiệp và máy móc thiết bị'], ans: 1, exp: 'Đây là bẫy kinh điển nhất! CSHT trong triết học là tổng hợp các QHSX (thống trị, tàn dư, mầm mống) hợp thành cơ cấu kinh tế xã hội, KHÔNG phải hạ tầng kỹ thuật.' },
  { id: 'q34', ch: 3, topic: 'c3-1', level: 'Nhận biết', q: 'Trong kiến trúc thượng tầng của xã hội có giai cấp, bộ phận nào có quyền lực mạnh mẽ nhất và tác động trực tiếp nhất tới cơ sở hạ tầng?', opts: ['Tôn giáo và giáo hội', 'Nhà nước', 'Nghệ thuật và đạo đức', 'Các hiệp hội nghề nghiệp'], ans: 1, exp: 'Nhà nước nắm bộ máy cưỡng chế và pháp luật nên là bộ phận có quyền lực mạnh nhất trong KTTT.' },
  { id: 'q35', ch: 3, topic: 'c3-1', level: 'Vận dụng', q: 'Quan điểm "bỏ qua chế độ tư bản chủ nghĩa" trong thời kỳ quá độ lên CNXH ở Việt Nam được hiểu chính xác là:', opts: ['Bỏ qua hoàn toàn mọi thành tựu khoa học, công nghệ và kinh tế thị trường của CNTB', 'Bỏ qua việc xác lập vị trí thống trị của QHSX và KTTT TBCN, nhưng tiếp thu, kế thừa thành tựu KHCN và quản lý của nhân loại dưới CNTB', 'Phát triển đầy đủ CNTB trước rồi mới tiến lên CNXH', 'Chỉ giữ lại KTTT TBCN và xóa bỏ QHSX TBCN'], ans: 1, exp: 'Đại hội IX của Đảng khẳng định rõ: bỏ qua vị trí thống trị của QHSX và KTTT TBCN nhưng tiếp thu, kế thừa thành tựu mà nhân loại đạt được dưới chế độ TBCN, đặc biệt về KHCN.' },
  { id: 'q36', ch: 3, topic: 'c3-2', level: 'Câu bẫy', q: 'Nguyên nhân TRỰC TIẾP dẫn đến sự ra đời của giai cấp trong lịch sử là:', opts: ['Sự phân công lao động xã hội lần thứ nhất', 'Sự xuất hiện chế độ tư hữu về tư liệu sản xuất', 'Chiến tranh giữa các bộ lạc', 'Sự chênh lệch về thể chất và trí tuệ giữa các cá nhân'], ans: 1, exp: 'Nguyên nhân sâu xa là sự phát triển LLSX; nguyên nhân trực tiếp dẫn tới phân hóa giai cấp là chế độ tư hữu về TLSX.' },
  { id: 'q37', ch: 3, topic: 'c3-2', level: 'Thông hiểu', q: 'Sự hình thành dân tộc ở phương Đông (trong đó có Việt Nam) có điểm khác biệt căn bản nào so với phương Tây?', opts: ['Hình thành muộn hơn sau khi CNTB đã phát triển cao', 'Hình thành sớm hơn trước khi CNTB ra đời, gắn với yêu cầu trị thủy và chống ngoại xâm', 'Không cần lãnh thổ thống nhất', 'Chỉ dựa trên sự thống nhất tôn giáo'], ans: 1, exp: 'Dân tộc phương Đông (Việt Nam, Trung Quốc...) hình thành sớm hơn trên cơ sở văn hóa, tâm lý, trị thủy và đấu tranh chống ngoại xâm, trước khi CNTB xác lập.' },
  { id: 'q38', ch: 3, topic: 'c3-3', level: 'Câu bẫy', q: 'Theo Triết học Mác - Lênin, nhà nước ra đời là do:', opts: ['Khế ước xã hội tự nguyện giữa mọi công dân bình đẳng', 'Mâu thuẫn giai cấp phát triển đến mức không thể điều hòa được', 'Nhu cầu tổ chức săn bắt hái lượm thời nguyên thủy', 'Ý muốn sáng tạo của một vị anh hùng kiệt xuất'], ans: 1, exp: 'Lênin khẳng định: Nhà nước là sản phẩm và biểu hiện của những mâu thuẫn giai cấp không thể điều hòa được.' },
  { id: 'q39', ch: 3, topic: 'c3-3', level: 'Nhận biết', q: 'Vấn đề cơ bản của mọi cuộc cách mạng xã hội là gì?', opts: ['Cải cách giáo dục và văn hóa', 'Giành chính quyền nhà nước', 'Tăng lương và giảm giờ làm cho công nhân', 'Thay đổi người đứng đầu chính phủ bằng đảo chính'], ans: 1, exp: 'Giành chính quyền nhà nước từ tay giai cấp thống trị lỗi thời về tay giai cấp cách mạng là vấn đề cơ bản quyết định thắng lợi của mọi cuộc CMXH.' },
  { id: 'q40', ch: 3, topic: 'c3-4', level: 'Câu bẫy', q: 'Trong 3 yếu tố cơ bản cấu thành Tồn tại xã hội, yếu tố nào giữ vai trò cơ bản, quyết định nhất?', opts: ['Điều kiện tự nhiên, hoàn cảnh địa lý', 'Dân số và mật độ dân số', 'Phương thức sản xuất vật chất', 'Trình độ giáo dục của dân cư'], ans: 2, exp: 'TTXH gồm: PTSX vật chất, điều kiện tự nhiên và dân số; trong đó PTSX vật chất là yếu tố cơ bản, quyết định nhất.' },
  { id: 'q41', ch: 3, topic: 'c3-4', level: 'Vận dụng', q: 'Hiện tượng một số tập tục lạc hậu (trọng nam khinh nữ, mê tín dị đoan) vẫn còn tồn tại dù nền kinh tế đã hiện đại hóa minh họa cho tính chất nào của Ý thức xã hội?', opts: ['Ý thức xã hội có thể vượt trước tồn tại xã hội', 'Ý thức xã hội thường lạc hậu hơn tồn tại xã hội', 'Ý thức xã hội có tính kế thừa', 'Ý thức xã hội quyết định tồn tại xã hội'], ans: 1, exp: 'Sức ỳ của thói quen, tập quán truyền thống khiến YTXH thường biến đổi chậm và lạc hậu hơn so với sự biến đổi của TTXH.' },
  { id: 'q42', ch: 3, topic: 'c3-4', level: 'Thông hiểu', q: 'Tại sao nước Đức thế kỷ XVIII – XIX có nền kinh tế lạc hậu hơn Anh, Pháp nhưng lại đạt đỉnh cao về Triết học cổ điển Đức?', opts: ['Do khí hậu và địa lý nước Đức thuận lợi hơn', 'Do tính kế thừa trong sự phát triển của ý thức xã hội', 'Do tồn tại xã hội không liên quan gì đến ý thức xã hội', 'Do ý thức cá nhân quyết định toàn bộ lịch sử'], ans: 1, exp: 'Nhờ tính kế thừa của YTXH, một dân tộc có kinh tế chưa phát triển nhất vẫn có thể kế thừa tinh hoa tư tưởng của nhân loại để đạt đỉnh cao về triết học, nghệ thuật.' },
  { id: 'q43', ch: 3, topic: 'c3-5', level: 'Câu bẫy', q: 'Luận điểm của C. Mác: "Trong tính hiện thực của nó, bản chất con người là tổng hòa những quan hệ xã hội" có nghĩa là:', opts: ['Bản chất con người chỉ là phép cộng cơ học các quan hệ bên ngoài', 'Bản chất con người bất biến từ khi sinh ra đến khi chết', 'Bản chất con người hình thành từ sự đan xen, tác động hữu cơ của các quan hệ xã hội cụ thể, lịch sử', 'Con người không có mặt sinh học, chỉ có mặt xã hội'], ans: 2, exp: 'Mác dùng "tổng hòa" để chỉ sự tổng hợp hữu cơ, đan xen của các quan hệ xã hội cụ thể trong lịch sử trên nền tảng thực thể sinh học - xã hội.' },
  { id: 'q44', ch: 3, topic: 'c3-5', level: 'Thông hiểu', q: 'Theo C. Mác, thực chất cốt lõi của hiện tượng tha hóa con người là gì?', opts: ['Con người đánh mất khả năng giao tiếp ngôn ngữ', 'Lao động của con người bị tha hóa dưới chế độ tư hữu tư liệu sản xuất', 'Con người quá phụ thuộc vào thiên nhiên hoang dã', 'Sự suy thoái đạo đức thuần túy do giáo dục kém'], ans: 1, exp: 'Lao động bị tha hóa là nguồn gốc và thực chất của mọi hình thức tha hóa khác: sản phẩm do người lao động làm ra quay lại thống trị chính họ.' },
  { id: 'q45', ch: 3, topic: 'c3-5', level: 'Câu bẫy', q: 'Ai là chủ thể sáng tạo chân chính, giữ vai trò quyết định sự phát triển của lịch sử xã hội?', opts: ['Các vị anh hùng, vĩ nhân và lãnh tụ kiệt xuất', 'Giai cấp thống trị nắm quyền lực nhà nước', 'Quần chúng nhân dân', 'Tầng lớp trí thức tinh hoa'], ans: 2, exp: 'Quần chúng nhân dân (với hạt nhân là người lao động sản xuất) là lực lượng quyết định sáng tạo lịch sử. Lãnh tụ có vai trò quan trọng nhưng không thể thay thế quần chúng.' }
];

const TF_BANK = [
  { id: 'tf1', ch: 1, stmt: 'Triết học là toàn bộ thế giới quan của con người.', isTrue: false, exp: 'SAI. Triết học không phải là toàn bộ thế giới quan mà là HẠT NHÂN LÝ LUẬN của thế giới quan (thế giới quan còn có huyền thoại, tôn giáo, kinh nghiệm đời thường).' },
  { id: 'tf2', ch: 1, stmt: 'Cả chủ nghĩa duy vật và chủ nghĩa duy tâm đều thuộc lập trường nhất nguyên luận.', isTrue: true, exp: 'ĐÚNG. Cả hai đều chỉ thừa nhận MỘT bản nguyên duy nhất quyết định thế giới (hoặc vật chất, hoặc tinh thần). Chỉ nhị nguyên luận mới thừa nhận 2 bản nguyên song song.' },

  { id: 'tf4', ch: 1, stmt: 'Phép biện chứng duy vật là sự kế thừa nguyên xi phép biện chứng của Hêghen.', isTrue: false, exp: 'SAI. Mác - Ăngghen kế thừa CÓ PHÊ PHÁN, tước bỏ vỏ thần bí duy tâm của Hegel để xây dựng phép biện chứng trên lập trường duy vật.' },

const STORAGE_KEY = 'mln_study_hub_v1';
const defaultProgress = {
  completedTopics: [],
  mcqResults: {},      // { qId: { selected, correct } }
  tfResults: {},       // { tfId: { selected, correct } }
  masteredTraps: [],   // [ 'c1-1-0', ... ]
  knownCards: [],      // [ 'f1', ... ]
  essayChecks: {},     // { 'e1-0': true }
  essayNotes: {},      // { e1: '...' }
  mockHistory: [],     // [ { date, score, total, pct } ]
  darkMode: false
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultProgress));
    return { ...JSON.parse(JSON.stringify(defaultProgress)), ...JSON.parse(raw) };
  } catch (e) {
    return JSON.parse(JSON.stringify(defaultProgress));
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
  } catch (e) {}
}

function showToast(msg, type = 'info') {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  const colors = type === 'success' ? 'bg-emerald-700 text-white' : type === 'warn' ? 'bg-amber-600 text-white' : 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900';
  el.className = `pointer-events-auto px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg fade-in ${colors}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2400);
}

function getAllTraps() {
  const list = [];
  TOPICS.forEach(t => {
    t.traps.forEach((tr, idx) => {
      list.push({ id: `${t.id}-${idx}`, ch: t.chapter, topicId: t.id, topicCode: t.code, topicTitle: t.title, ...tr });
    });
  });
  return list;
}

function getStats() {
  const totalTopics = TOPICS.length;
  const doneTopics = state.progress.completedTopics.length;
  const mcqAnswered = Object.keys(state.progress.mcqResults).length;
  const mcqCorrect = Object.values(state.progress.mcqResults).filter(r => r.correct).length;
  const mcqWrong = mcqAnswered - mcqCorrect;
  const tfAnswered = Object.keys(state.progress.tfResults).length;
  const tfCorrect = Object.values(state.progress.tfResults).filter(r => r.correct).length;
  const totalTraps = getAllTraps().length;
  const masteredTraps = state.progress.masteredTraps.length;
  const knownCards = state.progress.knownCards.length;
  const accTotal = mcqAnswered + tfAnswered;
  const accCorrect = mcqCorrect + tfCorrect;
  const accuracy = accTotal > 0 ? Math.round((accCorrect / accTotal) * 100) : 0;
  return { totalTopics, doneTopics, mcqAnswered, mcqCorrect, mcqWrong, tfAnswered, tfCorrect, totalTraps, masteredTraps, knownCards, accuracy };
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function applyDarkMode() {
  document.documentElement.classList.toggle('dark', !!state.progress.darkMode);
}

// 9. NAVIGATION & RENDER ROUTER

function setView(view, extra = {}) {
  if (state.mockActive && state.mockActive.timerId && view !== 'practice') {
    clearInterval(state.mockActive.timerId);
    state.mockActive.timerId = null;
  }
  state.view = view;
  Object.assign(state, extra);
  document.getElementById('mobileNavDrawer').classList.add('hidden');
  updateNavActive();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavActive() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.nav === state.view;
    btn.className = active
      ? 'nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 bg-white dark:bg-stone-700 text-crimson-700 dark:text-crimson-300 shadow-xs'
      : 'nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5 text-stone-600 dark:text-stone-300 hover:text-stone-900 dark:hover:text-white';
  });
}

function render() {
  const main = document.getElementById('appMain');
  if (state.view === 'dashboard') main.innerHTML = renderDashboard();
  else if (state.view === 'study') main.innerHTML = renderStudy();
  else if (state.view === 'practice') main.innerHTML = renderPractice();
  else if (state.view === 'essays') main.innerHTML = renderEssays();
  else if (state.view === 'traps') main.innerHTML = renderTraps();
  else if (state.view === 'flashcards') main.innerHTML = renderFlashcards();
  if (window.lucide) lucide.createIcons();
}

                              </span>
                              <span class="truncate font-medium"><strong>${t.code}</strong> ${t.title}</span>
                            </span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-stone-400 shrink-0"></i>
                          </button>
                        </li>
                      `;
                    }).join('')}
                  </ul>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>

      <!-- Mock Exam History -->
      ${state.progress.mockHistory.length > 0 ? `
        <section class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-5">
          <h3 class="text-sm font-bold mb-3 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-crimson-600"></i> Lịch sử Thi thử gần đây</h3>
          <div class="grid sm:grid-cols-3 gap-2.5">
            ${state.progress.mockHistory.slice(-6).reverse().map(h => `
              <div class="p-3 rounded-xl bg-stone-50 dark:bg-stone-800/60 border border-stone-200/70 dark:border-stone-700 flex items-center justify-between">
                <div>
                  <div class="text-xs font-semibold">${h.score}/${h.total} câu đúng</div>
                  <div class="text-[11px] text-stone-500">${h.date}</div>
                </div>
                <div class="text-lg font-extrabold ${h.pct >= 80 ? 'text-emerald-600' : h.pct >= 50 ? 'text-amber-600' : 'text-crimson-600'}">${(h.pct / 10).toFixed(1)}đ</div>
              </div>
            `).join('')}
          </div>
        </section>
      ` : ''}
    </div>
  `;
}

// ============================================================================
// 11. VIEW: STUDY (LÝ THUYẾT CHI TIẾT + NÂNG CAO + BẪY + BÀI TẬP NHANH)
// ============================================================================
function renderStudy() {
  const topic = TOPICS.find(t => t.id === state.activeTopicId) || TOPICS[0];
  const isDone = state.progress.completedTopics.includes(topic.id);
  const topicMcqs = MCQ_BANK.filter(q => q.topic === topic.id);

  return `
    <div class="grid lg:grid-cols-12 gap-5 fade-in">
      <!-- Topic Sidebar -->
      <aside class="lg:col-span-4 xl:col-span-3 space-y-3">
        <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-3.5 lg:sticky lg:top-20">
          <div class="text-xs font-bold uppercase tracking-wider text-stone-500 px-2 mb-2">Mục lục 3 Chương</div>
          <div class="space-y-3 max-h-[65vh] overflow-y-auto scrollbar-thin pr-1">
            ${[1, 2, 3].map(ch => `
              <div>
                <div class="text-[11px] font-bold text-crimson-700 dark:text-crimson-400 px-2 mb-1">CHƯƠNG ${ch}</div>
                <div class="space-y-1">
                  ${TOPICS.filter(t => t.chapter === ch).map(t => {
                    const active = t.id === topic.id;
                    const done = state.progress.completedTopics.includes(t.id);
                    return `
                      <button data-select-topic="${t.id}" class="w-full text-left px-2.5 py-2 rounded-xl text-xs transition flex items-start gap-2 ${active ? 'bg-crimson-50 dark:bg-crimson-900/40 text-crimson-800 dark:text-crimson-200 font-bold' : 'hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-700 dark:text-stone-300'}">
                        <span class="mt-0.5 w-4 h-4 rounded-full flex items-center justify-center shrink-0 ${done ? 'bg-emerald-600 text-white' : 'border border-stone-300 dark:border-stone-600 text-transparent'}">
                          <i data-lucide="check" class="w-2.5 h-2.5"></i>
                        </span>
                        <span class="leading-snug">${t.code}. ${t.title}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </aside>

      <!-- Main Topic Content -->
      <section class="lg:col-span-8 xl:col-span-9 space-y-4">
        <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-5 sm:p-6">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-crimson-100 dark:bg-crimson-900/50 text-crimson-800 dark:text-crimson-200">Chương ${topic.chapter} • Mục ${topic.code}</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300">${topic.weight}</span>
              </div>
              <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">${topic.title}</h2>
              <p class="text-xs sm:text-sm text-stone-500 dark:text-stone-400 mt-1">${topic.subtitle}</p>
            </div>
            <button data-toggle-done="${topic.id}" class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shrink-0 ${isDone ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700'}">
              <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
              ${isDone ? 'Đã thuộc chuyên đề này' : 'Đánh dấu đã thuộc'}
            </button>
          </div>

          <!-- Sub-tabs -->
          <div class="flex flex-wrap gap-1.5 mt-5 pt-4 border-t border-stone-200 dark:border-stone-800">
            ${[
              { id: 'core', label: 'Kiến thức cốt lõi', icon: 'book-open' },
              { id: 'advanced', label: 'Nâng cao & Liên hệ', icon: 'sparkles' },
              { id: 'traps', label: `Bẫy dễ sai (${topic.traps.length})`, icon: 'alert-triangle' },
              { id: 'quick', label: `Luyện tập nhanh (${topicMcqs.length})`, icon: 'zap' }
            ].map(tab => `
              <button data-topic-tab="${tab.id}" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 ${state.topicSubTab === tab.id ? 'bg-crimson-700 text-white shadow-xs' : 'bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-stone-300 hover:bg-stone-200 dark:hover:bg-stone-700'}">
                <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i> ${tab.label}
              </button>
            `).join('')}
          </div>
        </div>

        <!-- Tab Body -->
        <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-5 sm:p-6">
          ${state.topicSubTab === 'core' ? renderTopicCore(topic) : ''}
          ${state.topicSubTab === 'advanced' ? renderTopicAdvanced(topic) : ''}
          ${state.topicSubTab === 'traps' ? renderTopicTraps(topic) : ''}
          ${state.topicSubTab === 'quick' ? renderTopicQuickQuiz(topicMcqs) : ''}
        </div>
      </section>
    </div>
  `;
}

function renderTopicCore(topic) {
  return `
    <div class="space-y-6">
      ${topic.core.map(sec => `
        <div class="space-y-3">
          <h3 class="text-base sm:text-lg font-bold text-crimson-800 dark:text-crimson-300 border-l-4 border-crimson-700 pl-3">${sec.heading}</h3>
          ${sec.quote ? `
            <blockquote class="p-4 rounded-xl bg-amber-50/80 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 text-sm italic font-medium text-stone-800 dark:text-amber-100 leading-relaxed">
              ${sec.quote}
            </blockquote>
          ` : ''}
          ${sec.points ? `
            <ul class="space-y-2.5 text-sm leading-relaxed text-stone-700 dark:text-stone-300">
              ${sec.points.map(p => `<li class="flex gap-2.5"><span class="text-crimson-600 font-bold mt-0.5">•</span><span>${p}</span></li>`).join('')}
            </ul>
          ` : ''}
          ${sec.table ? `
            <div class="overflow-x-auto rounded-xl border border-stone-200 dark:border-stone-700">
              <table class="w-full text-left text-xs sm:text-sm border-collapse">
                <thead>
                  <tr class="bg-stone-100 dark:bg-stone-800 text-stone-800 dark:text-stone-200">
                    ${sec.table.headers.map(h => `<th class="p-3 font-bold border-b border-stone-200 dark:border-stone-700">${h}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-stone-200 dark:divide-stone-800">
                  ${sec.table.rows.map(row => `
                    <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/40">
                      ${row.map((cell, ci) => `<td class="p-3 align-top leading-relaxed ${ci === 0 ? 'font-semibold text-stone-900 dark:text-white w-1/4' : 'text-stone-700 dark:text-stone-300'}">${cell}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function renderTopicAdvanced(topic) {
  return `
    <div class="space-y-4">
      <div class="flex items-center gap-2 text-teal-700 dark:text-teal-400 font-bold text-sm">
        <i data-lucide="sparkles" class="w-4 h-4"></i> Kiến thức Nâng cao, Bản chất sâu & Liên hệ thực tiễn ăn điểm 10
      </div>
      <div class="space-y-3">
        ${topic.advanced.map((item, i) => `
          <div class="p-4 rounded-xl bg-teal-50/70 dark:bg-teal-950/30 border border-teal-200 dark:border-teal-800/60 text-sm leading-relaxed text-stone-800 dark:text-stone-200">
            <span class="inline-block px-2 py-0.5 rounded bg-teal-700 text-white text-[10px] font-bold mr-2">NÂNG CAO #${i + 1}</span>
            ${item}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderTopicTraps(topic) {
  return `
    <div class="space-y-4">
      <div class="flex items-center gap-2 text-amber-700 dark:text-amber-400 font-bold text-sm">
        <i data-lucide="alert-triangle" class="w-4 h-4"></i> Cảnh báo Bẫy dễ sai của chuyên đề ${topic.code}
      </div>
      <div class="space-y-3">
        ${topic.traps.map((tr, idx) => {
          const trapId = `${topic.id}-${idx}`;
          const mastered = state.progress.masteredTraps.includes(trapId);
          return `
            <div class="rounded-xl border ${mastered ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/40 dark:bg-emerald-950/20' : 'border-amber-200 dark:border-amber-800/60 bg-amber-50/50 dark:bg-amber-950/20'} p-4 space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="text-sm font-semibold text-crimson-700 dark:text-crimson-400 flex items-start gap-2">
                  <i data-lucide="x-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                  <span>Hiểu nhầm phổ biến: ${tr.wrong}</span>
                </div>
                <button data-toggle-trap="${trapId}" class="px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 transition ${mastered ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-stone-800 border border-stone-300 dark:border-stone-600'}">
                  ${mastered ? 'Đã né bẫy' : 'Đánh dấu đã nhớ'}
                </button>
              </div>
              <div class="text-sm text-stone-800 dark:text-stone-200 flex items-start gap-2 pl-0.5">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
                <span><strong>Hiểu chuẩn:</strong> ${tr.right}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTopicQuickQuiz(qs) {
  if (!qs.length) return '<p class="text-sm text-stone-500">Chưa có câu hỏi cho mục này.</p>';
  return `
    <div class="space-y-4">
      <div class="text-sm font-bold text-stone-700 dark:text-stone-300">Làm nhanh ${qs.length} câu trắc nghiệm củng cố ngay sau khi đọc:</div>
      ${qs.map((q, idx) => renderMcqCard(q, idx + 1)).join('')}
    </div>
  `;
}

function renderMcqCard(q, num) {
  const res = state.progress.mcqResults[q.id];
  const levelColors = {
    'Nhận biết': 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300',
    'Thông hiểu': 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/40 dark:text-indigo-300',
    'Vận dụng': 'bg-teal-100 text-teal-800 dark:bg-teal-900/40 dark:text-teal-300',
    'Câu bẫy': 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300'
  };
  return `
    <div class="p-4 sm:p-5 rounded-2xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900/80 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-extrabold text-crimson-700 dark:text-crimson-400">Câu ${num}</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300">Chương ${q.ch}</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${levelColors[q.level] || ''}">${q.level}</span>
        </div>
        ${res ? `<button data-retry-mcq="${q.id}" class="text-[11px] font-semibold text-stone-500 hover:text-crimson-600">Làm lại</button>` : ''}
      </div>
      <p class="text-sm sm:text-[15px] font-semibold leading-relaxed">${q.q}</p>
      <div class="grid gap-2">
        ${q.opts.map((opt, oi) => {
          const letters = ['A', 'B', 'C', 'D'];
          let cls = 'border-stone-200 dark:border-stone-700 hover:border-crimson-400 hover:bg-stone-50 dark:hover:bg-stone-800';
          if (res) {
            if (oi === q.ans) cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-semibold';
            else if (oi === res.selected && oi !== q.ans) cls = 'border-crimson-500 bg-crimson-50 dark:bg-crimson-950/40 text-crimson-900 dark:text-crimson-200';
            else cls = 'border-stone-200 dark:border-stone-800 opacity-60';
          }
          return `
            <button data-answer-mcq="${q.id}" data-opt="${oi}" ${res ? 'disabled' : ''} class="w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition flex items-start gap-2.5 ${cls}">
              <span class="w-5 h-5 rounded-md bg-stone-100 dark:bg-stone-800 flex items-center justify-center text-[11px] font-bold shrink-0 mt-0.5">${letters[oi]}</span>
              <span>${opt}</span>
            </button>
          `;
        }).join('')}
      </div>
      ${res ? `
        <div class="p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed ${res.correct ? 'bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200' : 'bg-crimson-50 dark:bg-crimson-950/30 border border-crimson-200 dark:border-crimson-800 text-crimson-900 dark:text-crimson-200'}">
          <strong>${res.correct ? 'Chính xác!' : 'Chưa đúng!'}</strong> ${q.exp}
        </div>
      ` : ''}
    </div>
  `;
}

// ============================================================================
// 12. VIEW: PRACTICE ARENA (MCQ + ĐÚNG/SAI + GHÉP CẶP + THI THỬ)
// ============================================================================
function renderPractice() {
  const tabs = [
    { id: 'mcq', label: `Trắc nghiệm (${MCQ_BANK.length})`, icon: 'list-checks' },
    { id: 'tf', label: `Săn bẫy Đúng/Sai (${TF_BANK.length})`, icon: 'shield-alert' },
    { id: 'match', label: 'Ghép cặp Khái niệm', icon: 'git-compare' },
    { id: 'mock', label: 'Thi thử tính giờ', icon: 'timer' }
  ];

  return `
    <div class="space-y-5 fade-in">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold">Phòng Luyện Tập Đa Dạng</h2>
          <p class="text-xs sm:text-sm text-stone-500 dark:text-stone-400">Luyện 4 dạng bài tập khác nhau để phản xạ nhanh và né toàn bộ bẫy đề thi.</p>
        </div>
        <div class="flex flex-wrap gap-1.5 bg-stone-100 dark:bg-stone-900 p-1 rounded-xl border border-stone-200 dark:border-stone-800">
          ${tabs.map(t => `
            <button data-practice-mode="${t.id}" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${state.practiceMode === t.id ? 'bg-crimson-700 text-white shadow-xs' : 'text-stone-600 dark:text-stone-300 hover:bg-white dark:hover:bg-stone-800'}">
              <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i> ${t.label}
            </button>
          `).join('')}
        </div>
      </div>

      ${state.practiceMode === 'mcq' ? renderPracticeMcq() : ''}
      ${state.practiceMode === 'tf' ? renderPracticeTf() : ''}
      ${state.practiceMode === 'match' ? renderPracticeMatch() : ''}
      ${state.practiceMode === 'mock' ? renderPracticeMock() : ''}
    </div>
  `;
}

function renderPracticeMcq() {
  let list = MCQ_BANK.filter(q => {
    if (state.mcqFilterCh !== 'all' && String(q.ch) !== String(state.mcqFilterCh)) return false;
    if (state.mcqFilterLevel !== 'all' && q.level !== state.mcqFilterLevel) return false;
    if (state.mcqOnlyWrong) {
      const r = state.progress.mcqResults[q.id];
      if (!r || r.correct) return false;
    }
    return true;
  });

  return `
    <div class="space-y-4">
      <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-4 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-1.5 text-xs">
          <span class="font-semibold text-stone-500">Chương:</span>
          ${['all', '1', '2', '3'].map(c => `
            <button data-mcq-ch="${c}" class="px-2.5 py-1 rounded-lg font-semibold ${String(state.mcqFilterCh) === c ? 'bg-crimson-700 text-white' : 'bg-stone-100 dark:bg-stone-800'}">${c === 'all' ? 'Tất cả' : 'Ch ' + c}</button>
          `).join('')}
        </div>
        <div class="flex items-center gap-1.5 text-xs">
          <span class="font-semibold text-stone-500">Mức độ:</span>
          ${['all', 'Nhận biết', 'Thông hiểu', 'Vận dụng', 'Câu bẫy'].map(lv => `
            <button data-mcq-lv="${lv}" class="px-2.5 py-1 rounded-lg font-semibold ${state.mcqFilterLevel === lv ? 'bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900' : 'bg-stone-100 dark:bg-stone-800'}">${lv === 'all' ? 'Tất cả' : lv}</button>
          `).join('')}
        </div>
        <button data-toggle-wrong="1" class="ml-auto px-3 py-1.5 rounded-lg text-xs font-bold border transition ${state.mcqOnlyWrong ? 'bg-crimson-700 text-white border-crimson-700' : 'border-stone-300 dark:border-stone-700'}">
          Chỉ hiện câu từng sai
        </button>
      </div>

      ${list.length === 0 ? `
        <div class="text-center py-12 bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 text-sm text-stone-500">
          Không có câu hỏi nào khớp bộ lọc hiện tại.
        </div>
      ` : `
        <div class="space-y-3.5">
          ${list.map((q, i) => renderMcqCard(q, i + 1)).join('')}
        </div>
      `}
    </div>
  `;
}

function renderPracticeTf() {
  const list = TF_BANK.filter(t => state.tfFilterCh === 'all' || String(t.ch) === String(state.tfFilterCh));
  return `
    <div class="space-y-4">
      <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 text-xs">
          <span class="font-semibold text-stone-500">Lọc theo Chương:</span>
          ${['all', '1', '2', '3'].map(c => `
            <button data-tf-ch="${c}" class="px-2.5 py-1 rounded-lg font-semibold ${String(state.tfFilterCh) === c ? 'bg-crimson-700 text-white' : 'bg-stone-100 dark:bg-stone-800'}">${c === 'all' ? 'Tất cả (24)' : 'Chương ' + c}</button>
          `).join('')}
        </div>
        <span class="text-xs text-stone-500">Đọc kỹ từng từ khóa: <em>tuyệt đối/tương đối, trực tiếp/sâu xa, duy nhất/cơ bản</em></span>
      </div>

      <div class="grid md:grid-cols-2 gap-3.5">
        ${list.map((item, idx) => {
          const res = state.progress.tfResults[item.id];
          return `
            <div class="p-4 rounded-2xl bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 flex flex-col justify-between gap-3">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-[11px] font-bold text-amber-700 dark:text-amber-400">Nhận định #${idx + 1} • Chương ${item.ch}</span>
                  ${res ? `<button data-retry-tf="${item.id}" class="text-[11px] text-stone-400 hover:text-crimson-600">Làm lại</button>` : ''}
                </div>
                <p class="text-sm font-semibold leading-relaxed">${item.stmt}</p>
              </div>
              <div class="space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                  <button data-answer-tf="${item.id}" data-val="true" ${res ? 'disabled' : ''} class="py-2 rounded-xl text-xs font-bold border transition ${res && item.isTrue ? 'bg-emerald-600 text-white border-emerald-600' : res && res.selected === true && !item.isTrue ? 'bg-crimson-600 text-white border-crimson-600' : 'border-stone-200 dark:border-stone-700 hover:bg-stone-100 dark:hover:bg-stone-800'}">ĐÚNG</button>

  `;
}

function initMatchSet(setId) {
  const set = MATCH_SETS.find(s => s.id === setId) || MATCH_SETS[0];
  state.matchSetId = set.id;
  state.matchSelectedLeft = null;
  state.matchMatched = [];
  state.matchWrongPair = null;
  state.matchRightOrder = shuffleArray(set.pairs.map((_, i) => i));
}

function renderPracticeMatch() {
  const set = MATCH_SETS.find(s => s.id === state.matchSetId) || MATCH_SETS[0];
  if (state.matchRightOrder.length !== set.pairs.length) {
    state.matchRightOrder = shuffleArray(set.pairs.map((_, i) => i));
  }
  const doneAll = state.matchMatched.length === set.pairs.length;

  return `
    <div class="space-y-4">
      <div class="flex flex-wrap gap-2">
        ${MATCH_SETS.map(s => `
          <button data-match-set="${s.id}" class="px-3 py-2 rounded-xl text-xs font-semibold border transition ${s.id === set.id ? 'bg-crimson-700 text-white border-crimson-700' : 'bg-white dark:bg-stone-900 border-stone-200 dark:border-stone-800 hover:bg-stone-100 dark:hover:bg-stone-800'}">${s.title}</button>
        `).join('')}
      </div>

      <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between">
          <p class="text-xs sm:text-sm text-stone-600 dark:text-stone-400">Chọn 1 khái niệm ở <strong>cột trái</strong>, sau đó chọn định nghĩa tương ứng ở <strong>cột phải</strong>.</p>
          <span class="text-xs font-bold text-emerald-600">${state.matchMatched.length}/${set.pairs.length} cặp</span>
        </div>

        ${doneAll ? `
          <div class="p-5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-center space-y-2">
            <div class="text-base font-extrabold text-emerald-800 dark:text-emerald-300">Xuất sắc! Bạn đã ghép đúng toàn bộ ${set.pairs.length} cặp khái niệm!</div>
            <button data-match-reset="1" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Chơi lại & Xáo trộn</button>
          </div>
        ` : ''}

        <div class="grid md:grid-cols-2 gap-4">
          <div class="space-y-2.5">
            ${set.pairs.map((p, idx) => {
              const matched = state.matchMatched.includes(idx);
              const selected = state.matchSelectedLeft === idx;
              const wrong = state.matchWrongPair && state.matchWrongPair[0] === idx;
              return `
                <button data-match-left="${idx}" ${matched ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm font-bold transition ${matched ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-400 text-emerald-700 dark:text-emerald-300 opacity-75' : wrong ? 'bg-crimson-50 border-crimson-500 text-crimson-700' : selected ? 'bg-crimson-700 text-white border-crimson-700 shadow-sm' : 'border-stone-200 dark:border-stone-700 hover:border-crimson-400'}">
                  ${p.left}
                </button>
              `;
            }).join('')}
          </div>
          <div class="space-y-2.5">
            ${state.matchRightOrder.map(origIdx => {
              const p = set.pairs[origIdx];
              const matched = state.matchMatched.includes(origIdx);
              const wrong = state.matchWrongPair && state.matchWrongPair[1] === origIdx;
              return `
                <button data-match-right="${origIdx}" ${matched ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition ${matched ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-400 text-emerald-700 dark:text-emerald-300 opacity-75' : wrong ? 'bg-crimson-50 border-crimson-500 text-crimson-700' : 'border-stone-200 dark:border-stone-700 hover:border-crimson-400'}">
                  ${p.right}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function startMockExam(count, minutes) {
  if (state.mockActive && state.mockActive.timerId) clearInterval(state.mockActive.timerId);
  const questions = shuffleArray(MCQ_BANK).slice(0, Math.min(count, MCQ_BANK.length));
  state.mockActive = {
    questions,
    answers: {},
    timeLeft: minutes * 60,
    submitted: false,
    total: questions.length,
    timerId: null
  };
  state.mockActive.timerId = setInterval(() => {
    if (!state.mockActive || state.mockActive.submitted) return;
    state.mockActive.timeLeft -= 1;
    const el = document.getElementById('mockTimerDisplay');
    if (el) el.textContent = formatTime(state.mockActive.timeLeft);
    if (state.mockActive.timeLeft <= 0) submitMockExam();
  }, 1000);
  setView('practice', { practiceMode: 'mock' });
}

function formatTime(sec) {
  const m = Math.floor(Math.max(0, sec) / 60);
  const s = Math.max(0, sec) % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function submitMockExam() {
  if (!state.mockActive || state.mockActive.submitted) return;
  clearInterval(state.mockActive.timerId);
  state.mockActive.timerId = null;
  state.mockActive.submitted = true;
  let score = 0;
  state.mockActive.questions.forEach(q => {
    const sel = state.mockActive.answers[q.id];
    const ok = sel === q.ans;
    if (ok) score++;
    if (sel !== undefined) {
      state.progress.mcqResults[q.id] = { selected: sel, correct: ok };
    }
  });
  const pct = Math.round((score / state.mockActive.total) * 100);
  const now = new Date();
  const dateStr = `${now.getDate()}/${now.getMonth() + 1} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  state.progress.mockHistory.push({ date: dateStr, score, total: state.mockActive.total, pct });
  saveProgress();
  showToast(`Đã nộp bài! Kết quả: ${score}/${state.mockActive.total} (${(pct / 10).toFixed(1)} điểm)`, pct >= 80 ? 'success' : 'info');
  render();
}

                  <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300">BẪY #${i + 1} • Mục ${tr.topicCode}</span>
                  <button data-toggle-trap="${tr.id}" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${mastered ? 'bg-emerald-600 text-white' : 'bg-stone-100 dark:bg-stone-800 hover:bg-stone-200'}">
                    ${mastered ? 'Đã né bẫy ✓' : 'Đánh dấu đã thuộc'}
                  </button>
                </div>
                <div class="text-sm font-bold text-crimson-700 dark:text-crimson-400 flex items-start gap-2">
                  <i data-lucide="x-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                  <span>${tr.wrong}</span>
                </div>
                <div class="text-xs sm:text-sm text-stone-700 dark:text-stone-300 flex items-start gap-2 leading-relaxed">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 shrink-0 mt-0.5"></i>
                  <span>${tr.right}</span>
                </div>
              </div>
              <button data-open-topic="${tr.topicId}" class="text-[11px] font-semibold text-stone-500 hover:text-crimson-600 self-start flex items-center gap-1">
                Xem lại bài ${tr.topicCode}: ${tr.topicTitle} <i data-lucide="arrow-right" class="w-3 h-3"></i>
              </button>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// ============================================================================
// 15. VIEW: FLASHCARDS
// ============================================================================
function getFilteredFlashcards() {
  const ordered = state.fcOrder.map(id => FLASHCARDS.find(f => f.id === id)).filter(Boolean);
  return ordered.filter(f => state.fcFilterCh === 'all' || String(f.ch) === String(state.fcFilterCh));
}

function renderFlashcards() {
  const deck = getFilteredFlashcards();
  if (state.fcIndex >= deck.length) state.fcIndex = 0;
  const card = deck[state.fcIndex] || FLASHCARDS[0];
  const known = state.progress.knownCards.includes(card.id);

  return `
    <div class="max-w-2xl mx-auto space-y-5 fade-in">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold">Flashcards Ôn Siêu Tốc</h2>
          <p class="text-xs text-stone-500">Bấm vào thẻ (hoặc phím Space) để lật mặt đáp án. Dùng phím ← / → để chuyển thẻ.</p>
        </div>
        <div class="flex items-center gap-1.5 text-xs">
          ${['all', '1', '2', '3'].map(c => `
            <button data-fc-ch="${c}" class="px-2.5 py-1.5 rounded-lg font-semibold ${String(state.fcFilterCh) === c ? 'bg-crimson-700 text-white' : 'bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800'}">${c === 'all' ? 'Tất cả' : 'Ch ' + c}</button>
          `).join('')}
          <button data-fc-shuffle="1" class="px-2.5 py-1.5 rounded-lg font-semibold bg-stone-200 dark:bg-stone-800 hover:bg-stone-300 dark:hover:bg-stone-700 flex items-center gap-1">
            <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> Trộn
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs font-semibold text-stone-500">
        <span>Thẻ ${state.fcIndex + 1} / ${deck.length} • Chương ${card.ch}</span>
        <span>Đã thuộc: <strong class="text-emerald-600">${state.progress.knownCards.length}/${FLASHCARDS.length}</strong></span>
      </div>

      <!-- 3D Flip Card -->
      <div class="flashcard-scene w-full h-72 sm:h-80 cursor-pointer" data-fc-flip="1">
        <div class="flashcard-inner relative w-full h-full ${state.fcFlipped ? 'is-flipped' : ''}">
          <!-- Front -->
          <div class="flashcard-face absolute inset-0 rounded-3xl bg-white dark:bg-stone-900 border-2 border-stone-200 dark:border-stone-700 shadow-md p-6 sm:p-8 flex flex-col items-center justify-center text-center">
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-crimson-100 dark:bg-crimson-900/50 text-crimson-800 dark:text-crimson-200 mb-4">CÂU HỎI • CHƯƠNG ${card.ch}</span>
            <p class="text-lg sm:text-xl font-extrabold leading-snug">${card.front}</p>
            <span class="text-xs text-stone-400 mt-6 flex items-center gap-1"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Chạm để xem đáp án</span>
          </div>
          <!-- Back -->
          <div class="flashcard-face flashcard-back absolute inset-0 rounded-3xl bg-gradient-to-br from-crimson-800 to-stone-900 text-white shadow-md p-6 sm:p-8 flex flex-col items-center justify-center text-center">
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/20 mb-3">ĐÁP ÁN CHUẨN</span>
            <p class="text-sm sm:text-base leading-relaxed whitespace-pre-line font-medium">${card.back}</p>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between gap-2">
        <button data-fc-nav="-1" class="px-4 py-2.5 rounded-xl bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-xs sm:text-sm font-bold hover:bg-stone-100 dark:hover:bg-stone-800 flex items-center gap-1.5">
          <i data-lucide="chevron-left" class="w-4 h-4"></i> Trước
        </button>
        <button data-fc-known="${card.id}" class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${known ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-stone-950 hover:bg-amber-400'}">
          <i data-lucide="${known ? 'check-circle-2' : 'bookmark-plus'}" class="w-4 h-4"></i>
          ${known ? 'Đã thuộc thẻ này' : 'Đánh dấu đã thuộc'}
        </button>
        <button data-fc-nav="1" class="px-4 py-2.5 rounded-xl bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-700 text-xs sm:text-sm font-bold hover:bg-stone-100 dark:hover:bg-stone-800 flex items-center gap-1.5">
          Sau <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  `;
}

// ============================================================================
// 16. GLOBAL SEARCH
// ============================================================================
function performGlobalSearch(q) {
  const box = document.getElementById('globalSearchResults');
  const term = q.trim().toLowerCase();
  if (!term) {
    box.innerHTML = '<p class="text-stone-400 text-center py-6">Nhập từ khóa (ví dụ: vật chất, lượng chất, cơ sở hạ tầng, tha hóa, Lênin...)</p>';
    return;
  }
  const results = [];
  TOPICS.forEach(t => {
    const blob = `${t.title} ${t.subtitle} ${JSON.stringify(t.core)} ${t.advanced.join(' ')}`.toLowerCase();
    if (blob.includes(term)) {
      results.push({ type: 'Lý thuyết', title: `${t.code}. ${t.title}`, sub: t.subtitle, action: `open-topic`, val: t.id });
    }
  });
  getAllTraps().forEach(tr => {
    if (`${tr.wrong} ${tr.right}`.toLowerCase().includes(term)) {
      results.push({ type: 'Bẫy dễ sai', title: tr.wrong, sub: tr.right, action: `open-traps`, val: tr.ch });
    }
  });
  ESSAYS.forEach(e => {
    if (`${e.title} ${e.keywords.join(' ')}`.toLowerCase().includes(term)) {
      results.push({ type: 'Tự luận', title: e.title, sub: `Chương ${e.ch} • ${e.freq}`, action: `open-essay`, val: e.id });
    }
  });

  if (!results.length) {
    box.innerHTML = `<p class="text-stone-400 text-center py-6">Không tìm thấy kết quả cho "${q.replace(/</g, '&lt;')}".</p>`;
    return;
  }

  box.innerHTML = results.slice(0, 15).map(r => `
    <button data-search-jump="${r.action}" data-search-val="${r.val}" class="w-full text-left p-3 rounded-xl hover:bg-stone-100 dark:hover:bg-stone-800 transition border border-stone-200/70 dark:border-stone-800 block">
      <div class="flex items-center gap-2 mb-0.5">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.type === 'Bẫy dễ sai' ? 'bg-amber-100 text-amber-800' : r.type === 'Tự luận' ? 'bg-indigo-100 text-indigo-800' : 'bg-crimson-100 text-crimson-800'}">${r.type}</span>
        <span class="font-bold text-xs sm:text-sm truncate">${r.title}</span>
      </div>
      <p class="text-xs text-stone-500 dark:text-stone-400 line-clamp-2">${r.sub}</p>
    </button>
  `).join('');
}

// ============================================================================
// 17. EVENT DELEGATION & INITIALIZATION
// ============================================================================
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button, [data-fc-flip]');
  if (!btn) return;

  // Nav buttons
  if (btn.dataset.nav) { setView(btn.dataset.nav); return; }

  // Header controls
  if (btn.id === 'btnMobileMenu') {
    document.getElementById('mobileNavDrawer').classList.toggle('hidden');
    return;
  }
  if (btn.id === 'btnDarkMode') {
    state.progress.darkMode = !state.progress.darkMode;
    applyDarkMode();
    saveProgress();
    return;
  }
  if (btn.id === 'btnSearchModal') {
    document.getElementById('searchModal').classList.remove('hidden');
    setTimeout(() => document.getElementById('globalSearchInput').focus(), 50);
    return;
  }
  if (btn.id === 'btnCloseSearch') {
    document.getElementById('searchModal').classList.add('hidden');
    return;
  }
  if (btn.id === 'btnCancelReset') {
    document.getElementById('resetModal').classList.add('hidden');
    return;
  }
  if (btn.id === 'btnConfirmReset') {
    const keepDark = state.progress.darkMode;
    state.progress = JSON.parse(JSON.stringify(defaultProgress));
    state.progress.darkMode = keepDark;
    saveProgress();
    document.getElementById('resetModal').classList.add('hidden');
    showToast('Đã đặt lại toàn bộ tiến độ ôn tập.');
    render();
    return;
  }

  // Dashboard shortcuts
  if (btn.dataset.action === 'go-study') { setView('study'); return; }
  if (btn.dataset.action === 'go-traps') { setView('traps'); return; }
  if (btn.dataset.action === 'start-mock-20') { startMockExam(20, 15); return; }
  if (btn.dataset.action === 'open-reset') { document.getElementById('resetModal').classList.remove('hidden'); return; }

  // Open specific topic
  if (btn.dataset.openTopic) {
    setView('study', { activeTopicId: btn.dataset.openTopic, topicSubTab: 'core' });
    return;
  }
  if (btn.dataset.selectTopic) {
    state.activeTopicId = btn.dataset.selectTopic;
    state.topicSubTab = 'core';
    render();
    return;
  }
  if (btn.dataset.topicTab) {
    state.topicSubTab = btn.dataset.topicTab;
    render();
    return;
  }
  if (btn.dataset.toggleDone) {
    const id = btn.dataset.toggleDone;
    const arr = state.progress.completedTopics;
    const idx = arr.indexOf(id);
    if (idx >= 0) { arr.splice(idx, 1); showToast('Đã bỏ đánh dấu hoàn thành'); }
    else { arr.push(id); showToast('Tuyệt vời! Đã đánh dấu thuộc chuyên đề này', 'success'); }
    saveProgress();
    render();
    return;
  }

  // Traps toggle & filter
  if (btn.dataset.toggleTrap) {
    const id = btn.dataset.toggleTrap;
    const arr = state.progress.masteredTraps;
    const idx = arr.indexOf(id);
    if (idx >= 0) arr.splice(idx, 1);
    else { arr.push(id); showToast('Đã đánh dấu né được bẫy này!', 'success'); }
    saveProgress();
    render();
    return;
  }
  if (btn.dataset.trapCh) {
    state.trapFilterCh = btn.dataset.trapCh;
    render();
    return;
  }

  // Practice mode switching
  if (btn.dataset.practiceMode) {
    state.practiceMode = btn.dataset.practiceMode;
    render();
    return;
  }

  // MCQ interactions
  if (btn.dataset.mcqCh) { state.mcqFilterCh = btn.dataset.mcqCh; render(); return; }
  if (btn.dataset.mcqLv) { state.mcqFilterLevel = btn.dataset.mcqLv; render(); return; }
  if (btn.dataset.toggleWrong) { state.mcqOnlyWrong = !state.mcqOnlyWrong; render(); return; }
  if (btn.dataset.answerMcq) {
    const qId = btn.dataset.answerMcq;
    const opt = Number(btn.dataset.opt);
    const q = MCQ_BANK.find(x => x.id === qId);
    if (!q) return;
    state.progress.mcqResults[qId] = { selected: opt, correct: opt === q.ans };
    saveProgress();
    render();
    return;
  }
  if (btn.dataset.retryMcq) {
    delete state.progress.mcqResults[btn.dataset.retryMcq];
    saveProgress();
    render();
    return;
  }

  // True/False interactions
  if (btn.dataset.tfCh) { state.tfFilterCh = btn.dataset.tfCh; render(); return; }
  if (btn.dataset.answerTf) {
    const tfId = btn.dataset.answerTf;
    const val = btn.dataset.val === 'true';
    const item = TF_BANK.find(x => x.id === tfId);
    if (!item) return;
    state.progress.tfResults[tfId] = { selected: val, correct: val === item.isTrue };
    saveProgress();
    render();
    return;
  }
  if (btn.dataset.retryTf) {
    delete state.progress.tfResults[btn.dataset.retryTf];
    saveProgress();
    render();
    return;
  }

  // Matching interactions
  if (btn.dataset.matchSet) { initMatchSet(btn.dataset.matchSet); render(); return; }
  if (btn.dataset.matchReset) { initMatchSet(state.matchSetId); render(); return; }
  if (btn.dataset.matchLeft !== undefined) {
    state.matchSelectedLeft = Number(btn.dataset.matchLeft);
    state.matchWrongPair = null;
    render();
    return;
  }
  if (btn.dataset.matchRight !== undefined) {
    if (state.matchSelectedLeft === null) {
      showToast('Hãy chọn 1 khái niệm ở cột trái trước!', 'warn');
      return;
    }
    const rightIdx = Number(btn.dataset.matchRight);
    if (state.matchSelectedLeft === rightIdx) {
      state.matchMatched.push(rightIdx);
      state.matchSelectedLeft = null;
      state.matchWrongPair = null;
      showToast('Ghép cặp chính xác!', 'success');
    } else {
      state.matchWrongPair = [state.matchSelectedLeft, rightIdx];
      showToast('Chưa khớp! Thử lại nhé.', 'warn');
    }
    render();
    return;
  }

  // Mock Exam interactions
  if (btn.dataset.startMock) {
    const [cnt, mins] = btn.dataset.startMock.split(',').map(Number);
    startMockExam(cnt, mins);
    return;
  }
  if (btn.dataset.mockPick) {
    if (!state.mockActive || state.mockActive.submitted) return;
    state.mockActive.answers[btn.dataset.mockPick] = Number(btn.dataset.opt);
    render();
    return;
  }
  if (btn.dataset.submitMock) { submitMockExam(); return; }
  if (btn.dataset.exitMock) { state.mockActive = null; render(); return; }

  // Essays interactions
  if (btn.dataset.essayCh) { state.essayFilterCh = btn.dataset.essayCh; render(); return; }
  if (btn.dataset.selectEssay) { state.activeEssayId = btn.dataset.selectEssay; render(); return; }

  // Flashcards interactions
  if (btn.dataset.fcCh) { state.fcFilterCh = btn.dataset.fcCh; state.fcIndex = 0; state.fcFlipped = false; render(); return; }
  if (btn.dataset.fcShuffle) { state.fcOrder = shuffleArray(state.fcOrder); state.fcIndex = 0; state.fcFlipped = false; showToast('Đã xáo trộn bộ thẻ!'); render(); return; }
  if (btn.dataset.fcFlip) { state.fcFlipped = !state.fcFlipped; render(); return; }
  if (btn.dataset.fcNav) {
    const deck = getFilteredFlashcards();
    const dir = Number(btn.dataset.fcNav);
    state.fcIndex = (state.fcIndex + dir + deck.length) % deck.length;
    state.fcFlipped = false;
    render();
    return;
  }
  if (btn.dataset.fcKnown) {
    const id = btn.dataset.fcKnown;
    const arr = state.progress.knownCards;
    const idx = arr.indexOf(id);
    if (idx >= 0) arr.splice(idx, 1);
    else { arr.push(id); showToast('Đã lưu vào danh sách thẻ đã thuộc!', 'success'); }
    saveProgress();
    render();
    return;
  }

  // Search Jump
  if (btn.dataset.searchJump) {
    document.getElementById('searchModal').classList.add('hidden');
    const act = btn.dataset.searchJump;
    const val = btn.dataset.searchVal;
    if (act === 'open-topic') setView('study', { activeTopicId: val, topicSubTab: 'core' });
    else if (act === 'open-traps') setView('traps', { trapFilterCh: val });
    else if (act === 'open-essay') setView('essays', { essayFilterCh: 'all', activeEssayId: val });
    return;
  }
});

// Checkbox & Textarea events for Essays
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.essayCheck) {
    state.progress.essayChecks[e.target.dataset.essayCheck] = e.target.checked;
    saveProgress();
    render();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'globalSearchInput') {
    performGlobalSearch(e.target.value);
  } else if (e.target.dataset && e.target.dataset.essayNote) {
    state.progress.essayNotes[e.target.dataset.essayNote] = e.target.value;
    saveProgress();
  }
});

// Keyboard shortcuts for Flashcards & Search Modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('searchModal').classList.add('hidden');
    document.getElementById('resetModal').classList.add('hidden');
  }
  if (state.view === 'flashcards' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    const deck = getFilteredFlashcards();
    if (e.code === 'Space') { e.preventDefault(); state.fcFlipped = !state.fcFlipped; render(); }
    else if (e.key === 'ArrowRight') { state.fcIndex = (state.fcIndex + 1) % deck.length; state.fcFlipped = false; render(); }
    else if (e.key === 'ArrowLeft') { state.fcIndex = (state.fcIndex - 1 + deck.length) % deck.length; state.fcFlipped = false; render(); }
  }
});

// Close search modal on backdrop click
document.getElementById('searchModal').addEventListener('click', (e) => {
  if (e.target.id === 'searchModal') e.target.classList.add('hidden');
});

// Boot
applyDarkMode();
initMatchSet('m1');
updateNavActive();
render();
</script>

</html>
